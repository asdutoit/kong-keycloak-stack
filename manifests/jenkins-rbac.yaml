apiVersion: v1
kind: ServiceAccount
metadata:
  name: jenkins
  namespace: kong-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: jenkins-provisioner
  namespace: kong-system
rules:
  # Jobs for running Pulumi provisioner
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "delete", "get", "list", "watch"]
  # ConfigMaps for passing OpenAPI specs
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["create", "delete", "get", "list"]
  # Pods for checking job status and logs
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: jenkins-provisioner
  namespace: kong-system
subjects:
  - kind: ServiceAccount
    name: jenkins
    namespace: kong-system
roleRef:
  kind: Role
  name: jenkins-provisioner
  apiGroup: rbac.authorization.k8s.io
