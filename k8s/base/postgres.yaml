apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
  namespace: kong-system
data:
  init-app-db.sql: |
    -- Create the two app databases used by the api-onboarding app:
    --   appdb            — Internal portal (full wizard + producer flows)
    --   appdb_external   — External developer portal (catalog + key requests)
    -- Both share the same `appuser`; the two-app split mirrors the
    -- production deployment topology (Internal on EW-MC, External on
    -- NS-BC) so local dev can exercise the cross-portal webhook flow.
    CREATE DATABASE appdb;
    CREATE USER appuser WITH ENCRYPTED PASSWORD 'apppass' CREATEDB;
    GRANT ALL PRIVILEGES ON DATABASE appdb TO appuser;
    ALTER DATABASE appdb OWNER TO appuser;
    \c appdb
    GRANT ALL ON SCHEMA public TO appuser;
    ALTER SCHEMA public OWNER TO appuser;

    \c postgres
    CREATE DATABASE appdb_external;
    GRANT ALL PRIVILEGES ON DATABASE appdb_external TO appuser;
    ALTER DATABASE appdb_external OWNER TO appuser;
    \c appdb_external
    GRANT ALL ON SCHEMA public TO appuser;
    ALTER SCHEMA public OWNER TO appuser;

    -- Keycloak — replaces the default in-memory H2 DB so realms/users
    -- survive Keycloak pod restarts. Matches KC_DB_USERNAME / KC_DB_PASSWORD
    -- in k8s/base/keycloak.yaml.
    \c postgres
    CREATE USER keycloak WITH ENCRYPTED PASSWORD 'keycloakpass';
    CREATE DATABASE keycloak OWNER keycloak;
    GRANT ALL PRIVILEGES ON DATABASE keycloak TO keycloak;
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data
  namespace: kong-system
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: kong-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
      - name: postgres
        image: postgres:17-alpine
        env:
        - name: POSTGRES_USER
          value: kong
        - name: POSTGRES_PASSWORD
          value: kongpass
        - name: POSTGRES_DB
          value: kong
        - name: PGDATA
          value: /var/lib/postgresql/data/pgdata
        ports:
        - containerPort: 5432
        readinessProbe:
          exec:
            command: ["pg_isready", "-U", "kong"]
          initialDelaySeconds: 5
          periodSeconds: 5
        volumeMounts:
        - name: postgres-data
          mountPath: /var/lib/postgresql/data
        - name: postgres-init
          mountPath: /docker-entrypoint-initdb.d
      volumes:
      - name: postgres-data
        persistentVolumeClaim:
          claimName: postgres-data
      - name: postgres-init
        configMap:
          name: postgres-init
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: kong-system
spec:
  selector:
    app: postgres
  ports:
  - port: 5432
    targetPort: 5432
