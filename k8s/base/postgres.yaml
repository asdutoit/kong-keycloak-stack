apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
  namespace: kong-system
data:
  init-app-db.sql: |
    -- Create app database and user for Next.js applications
    CREATE DATABASE appdb;
    CREATE USER appuser WITH ENCRYPTED PASSWORD 'apppass' CREATEDB;
    GRANT ALL PRIVILEGES ON DATABASE appdb TO appuser;
    ALTER DATABASE appdb OWNER TO appuser;
    \c appdb
    GRANT ALL ON SCHEMA public TO appuser;
    ALTER SCHEMA public OWNER TO appuser;
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data
  namespace: kong-system
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: kong-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
      - name: postgres
        image: postgres:17-alpine
        env:
        - name: POSTGRES_USER
          value: kong
        - name: POSTGRES_PASSWORD
          value: kongpass
        - name: POSTGRES_DB
          value: kong
        - name: PGDATA
          value: /var/lib/postgresql/data/pgdata
        ports:
        - containerPort: 5432
        readinessProbe:
          exec:
            command: ["pg_isready", "-U", "kong"]
          initialDelaySeconds: 5
          periodSeconds: 5
        volumeMounts:
        - name: postgres-data
          mountPath: /var/lib/postgresql/data
        - name: postgres-init
          mountPath: /docker-entrypoint-initdb.d
      volumes:
      - name: postgres-data
        persistentVolumeClaim:
          claimName: postgres-data
      - name: postgres-init
        configMap:
          name: postgres-init
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: kong-system
spec:
  selector:
    app: postgres
  ports:
  - port: 5432
    targetPort: 5432
