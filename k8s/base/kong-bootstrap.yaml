apiVersion: batch/v1
kind: Job
metadata:
  name: kong-bootstrap-plugins
  namespace: kong-system
spec:
  backoffLimit: 10
  ttlSecondsAfterFinished: 600
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: bootstrap
          image: curlimages/curl:8.10.1
          env:
            # Logging transport for the global Kong log plugin.
            #   file-log -> /dev/stdout  (default; tailed by Promtail into Loki)
            #   http-log -> LOG_HTTP_ENDPOINT (prod-style: ship to a collector)
            #   tcp-log  -> LOG_TCP_HOST:LOG_TCP_PORT
            #   off      -> do not enable any log plugin
            - name: LOG_PLUGIN
              value: "file-log"
            - name: LOG_HTTP_ENDPOINT
              value: ""
            - name: LOG_TCP_HOST
              value: ""
            - name: LOG_TCP_PORT
              value: ""
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              ADMIN="http://kong-admin.kong-system.svc.cluster.local:8001"

              echo "Waiting for Kong admin API..."
              until curl -fsS "$ADMIN/status" >/dev/null 2>&1; do
                sleep 2
              done

              # enable_plugin <name> <json-config>: create a global plugin only
              # if one of that name does not already exist (idempotent).
              enable_plugin() {
                name="$1"
                config="$2"
                echo "Checking for existing global $name plugin..."
                if curl -fsS "$ADMIN/plugins" | grep -q "\"name\":\"$name\""; then
                  echo "  $name plugin already exists — skipping."
                  return 0
                fi
                echo "  Enabling $name plugin globally..."
                curl -fsS -X POST "$ADMIN/plugins" \
                  -H "Content-Type: application/json" \
                  -d "$config"
                echo
              }

              # Metrics for Prometheus / Grafana dashboards.
              enable_plugin prometheus '{
                "name": "prometheus",
                "config": {
                  "per_consumer": true,
                  "status_code_metrics": true,
                  "latency_metrics": true,
                  "bandwidth_metrics": true,
                  "upstream_health_metrics": true
                }
              }'

              # Structured request/response logging. The log object includes
              # request & response headers, service, route, consumer and
              # latencies. It does NOT include request/response bodies — capture
              # those per-API with an x-kong-plugin-post-function in the spec.
              # The transport is selected via the LOG_PLUGIN env var.
              echo "Configuring log transport: $LOG_PLUGIN"
              case "$LOG_PLUGIN" in
                off)
                  echo "  Logging plugin disabled (LOG_PLUGIN=off)."
                  ;;
                file-log)
                  enable_plugin file-log '{
                    "name": "file-log",
                    "config": { "path": "/dev/stdout", "reopen": false }
                  }'
                  ;;
                http-log)
                  if [ -z "$LOG_HTTP_ENDPOINT" ]; then
                    echo "ERROR: LOG_PLUGIN=http-log requires LOG_HTTP_ENDPOINT" >&2
                    exit 1
                  fi
                  enable_plugin http-log "{
                    \"name\": \"http-log\",
                    \"config\": {
                      \"http_endpoint\": \"$LOG_HTTP_ENDPOINT\",
                      \"method\": \"POST\",
                      \"content_type\": \"application/json\"
                    }
                  }"
                  ;;
                tcp-log)
                  if [ -z "$LOG_TCP_HOST" ] || [ -z "$LOG_TCP_PORT" ]; then
                    echo "ERROR: LOG_PLUGIN=tcp-log requires LOG_TCP_HOST and LOG_TCP_PORT" >&2
                    exit 1
                  fi
                  enable_plugin tcp-log "{
                    \"name\": \"tcp-log\",
                    \"config\": { \"host\": \"$LOG_TCP_HOST\", \"port\": $LOG_TCP_PORT }
                  }"
                  ;;
                *)
                  echo "ERROR: unknown LOG_PLUGIN '$LOG_PLUGIN'" >&2
                  exit 1
                  ;;
              esac

              echo "Done."
