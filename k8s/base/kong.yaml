apiVersion: apps/v1
kind: Deployment
metadata:
  name: kong
  namespace: kong-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kong
  template:
    metadata:
      labels:
        app: kong
    spec:
      initContainers:
      - name: kong-migrations
        image: kong:3.9
        command: ["kong", "migrations", "bootstrap"]
        env:
        - name: KONG_DATABASE
          value: "postgres"
        - name: KONG_PG_HOST
          value: "postgres.kong-system.svc.cluster.local"
        - name: KONG_PG_USER
          value: "kong"
        - name: KONG_PG_PASSWORD
          value: "kongpass"
        - name: KONG_PG_DATABASE
          value: "kong"
      containers:
      - name: kong
        image: kong:3.9
        env:
        - name: KONG_DATABASE
          value: "postgres"
        - name: KONG_PG_HOST
          value: "postgres.kong-system.svc.cluster.local"
        - name: KONG_PG_USER
          value: "kong"
        - name: KONG_PG_PASSWORD
          value: "kongpass"
        - name: KONG_PG_DATABASE
          value: "kong"
        - name: KONG_ADMIN_LISTEN
          value: "0.0.0.0:8001"
        - name: KONG_PROXY_LISTEN
          value: "0.0.0.0:8000"
        - name: KONG_ADMIN_GUI_LISTEN
          value: "0.0.0.0:8002"
        - name: KONG_ADMIN_GUI_URL
          value: "http://localhost:8002"
        - name: KONG_ADMIN_GUI_API_URL
          value: "http://localhost:8001"
        ports:
        - containerPort: 8000
          name: proxy
        - containerPort: 8001
          name: admin
        - containerPort: 8002
          name: manager
        readinessProbe:
          httpGet:
            path: /status
            port: 8001
          initialDelaySeconds: 10
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /status
            port: 8001
          initialDelaySeconds: 15
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: kong-proxy
  namespace: kong-system
spec:
  selector:
    app: kong
  ports:
  - port: 8000
    targetPort: 8000
    name: proxy
  type: LoadBalancer
---
apiVersion: v1
kind: Service
metadata:
  name: kong-admin
  namespace: kong-system
spec:
  selector:
    app: kong
  ports:
  - port: 8001
    targetPort: 8001
    name: admin
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: kong-manager
  namespace: kong-system
spec:
  selector:
    app: kong
  ports:
  - port: 8002
    targetPort: 8002
    name: manager
  type: ClusterIP
